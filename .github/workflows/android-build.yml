name: Android verify

on:
  push:
    branches:
      - android/native-engine
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        timeout-minutes: 5
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Lint
        timeout-minutes: 5
        run: gradle :app:lintDebug --no-daemon --console=plain --stacktrace

      - name: Assemble debug
        timeout-minutes: 5
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taojinbi-android-v0.4-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

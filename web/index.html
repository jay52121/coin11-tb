<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android UI 自动化控制台</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2933;
    }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }
    section {
      background: #fff;
      border: 1px solid #d8dee6;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    button {
      font-family: "Microsoft YaHei", sans-serif;
      min-width: 84px;
      height: 36px;
      margin-right: 8px;
      border: 1px solid #b8c2cc;
      border-radius: 4px;
      background: #fff;
      color: #1f2933;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      filter: brightness(0.96);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    button.success {
      background: #0f766e;
      color: #fff;
      border-color: #0f766e;
    }
    button.danger {
      background: #b91c1c;
      color: #fff;
      border-color: #b91c1c;
    }
    button.warning {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }
    button.info {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    button.service {
      background: #374151;
      color: #fff;
      border-color: #374151;
    }
    button.energy {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
    }
    button.coin-outline {
      background: #fff;
      color: #92400e;
      border-color: #d97706;
      border-width: 2px;
    }
    button.energy-outline {
      background: #fff;
      color: #6d28d9;
      border-color: #7c3aed;
      border-width: 2px;
    }
    button.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #075985;
    }
    input,
    select {
      font-family: "Microsoft YaHei", sans-serif;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #b8c2cc;
      border-radius: 4px;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .toolbar-spacer {
      flex: 1;
    }
    .user-select {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #52616f;
      font-size: 13px;
      white-space: nowrap;
    }
    input.coin-input,
    .tag-editor.coin {
      border-color: #d97706;
      border-width: 2px;
    }
    input.energy-input,
    .tag-editor.energy {
      border-color: #7c3aed;
      border-width: 2px;
    }
    .exclude-grid {
      display: grid;
      grid-template-columns: 110px minmax(260px, 1fr) auto;
      gap: 10px;
      align-items: center;
      max-width: 920px;
    }
    .coin-label {
      color: #92400e;
      font-weight: 600;
    }
    .energy-label {
      color: #6d28d9;
      font-weight: 600;
    }
    .rules-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .rule-row {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 12px 0;
      border-top: 1px solid #e5e7eb;
    }
    .rule-name {
      margin-bottom: 6px;
      color: #52616f;
      font-size: 13px;
      font-weight: 600;
    }
    .rule-help {
      color: #7b8794;
      font-size: 12px;
      line-height: 1.35;
    }
    .rule-input {
      width: 100%;
      box-sizing: border-box;
    }
    .tag-editor {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      min-height: 38px;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #b8c2cc;
      border-radius: 4px;
      background: #fff;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 34px;
      align-items: center;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 4px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #f8fafc;
      color: #1f2933;
      font-size: 13px;
      line-height: 1.2;
      word-break: break-word;
    }
    .tag-editor.coin .tag {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #92400e;
    }
    .tag-editor.energy .tag {
      border-color: #a78bfa;
      background: #f5f3ff;
      color: #6d28d9;
    }
    .tag-remove {
      min-width: 20px;
      width: 20px;
      height: 20px;
      margin: 0;
      padding: 0;
      border-radius: 999px;
      border-color: transparent;
      background: transparent;
      color: inherit;
      line-height: 18px;
    }
    .tag-add {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto;
      gap: 6px;
      min-width: 260px;
    }
    .tag-add button {
      min-width: 58px;
      margin-right: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px 14px;
    }
    .label {
      color: #52616f;
    }
    .warn-inline {
      color: #b45309;
      font-size: 12px;
      font-weight: 700;
    }
    .coin-chart-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }
    .coin-chart-head h2 {
      margin: 0;
    }
    .coin-chart-summary {
      color: #52616f;
      font-size: 13px;
    }
    .coin-chart-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 12px;
    }
    .coin-stat {
      min-width: 112px;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #f8fafc;
    }
    .coin-stat-label {
      color: #64748b;
      font-size: 12px;
    }
    .coin-stat-value {
      margin-top: 2px;
      color: #0f172a;
      font-size: 18px;
      font-weight: 700;
    }
    .coin-chart-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      border: 1px solid #d8dee6;
      border-radius: 4px;
      background: #f8fafc;
    }
    .coin-chart-tooltip {
      position: absolute;
      display: none;
      min-width: 150px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.14);
      color: #0f172a;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 2;
    }
    .coin-record-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 10px;
      color: #334155;
      font-size: 13px;
    }
    .coin-record-list div {
      padding: 7px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
    }
    #coin_chart {
      display: block;
      width: 100%;
      height: 100%;
    }
    #logs {
      margin: 0;
      max-height: 420px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.45;
      background: #111827;
      color: #e5e7eb;
      padding: 12px;
      border-radius: 4px;
      user-select: text;
      cursor: text;
    }
    .log-line {
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }
    .log-line.page-action {
      margin: 2px 0;
      padding: 3px 6px;
      border-left: 3px solid #38bdf8;
      background: rgba(37, 99, 235, 0.34);
      color: #eff6ff;
    }
    .log-task-name {
      color: #fde68a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Android UI 自动化控制台</h1>

    <section class="toolbar">
      <div class="toolbar-actions">
        <button id="start_btn" class="success" onclick="startTask('taojinbi')">启动</button>
        <button id="stop_btn" class="danger" onclick="post('/api/stop')">停止</button>
        <button id="pause_btn" class="warning" onclick="post('/api/pause')">暂停</button>
        <button id="resume_btn" class="info" onclick="post('/api/resume')">继续</button>
        <button id="energy_btn" class="energy" onclick="startTask('energy')">做体力</button>
        <button id="restart_service_btn" class="service" onclick="restartService()">启动/重启服务</button>
      </div>
      <div class="toolbar-spacer"></div>
      <label class="user-select">
        淘宝用户
        <select id="android_user_select" onchange="saveAndroidUser()">
          <option value="0">主淘宝 user 0</option>
          <option value="999">分身淘宝 user 999</option>
        </select>
      </label>
      <label class="user-select">
        <input id="daily_fallback_toggle" type="checkbox" onchange="saveDailyFallback()">
        回日常版兜底
      </label>
      <label class="user-select">
        <input id="jump_energy_toggle" type="checkbox" onchange="saveJumpEnergy()">
        跳一跳
      </label>
      <label class="user-select">
        <input id="run_all_users_toggle" type="checkbox" onchange="saveRunAllUsers()">
        连续运行后续用户
      </label>
    </section>

    <section>
      <div class="grid">
        <div class="label">当前运行状态</div><div id="running">-</div>
        <div class="label">当前任务类型</div><div id="task_mode">-</div>
        <div class="label">当前版本号</div><div><span id="version">-</span> <span id="restart_hint" class="warn-inline"></span></div>
        <div class="label">淘宝用户</div><div id="android_user_id">-</div>
        <div class="label">当前淘金币</div><div id="taojinbi_coin">-</div>
        <div class="label">回日常版兜底</div><div id="daily_fallback">-</div>
        <div class="label">跳一跳</div><div id="jump_energy">-</div>
        <div class="label">当前 Activity</div><div id="activity">-</div>
        <div class="label">当前页面类型</div><div id="page_type">-</div>
        <div class="label">当前操作</div><div id="action">-</div>
        <div class="label">当前任务</div><div id="current_task">-</div>
        <div class="label">排除任务标签</div><div id="exclude_tags">-</div>
        <div class="label">最后错误</div><div id="last_error">-</div>
        <div class="label">更新时间</div><div id="updated_at">-</div>
      </div>
    </section>

    <section>
      <div class="coin-chart-head">
        <h2>淘金币记录</h2>
        <div id="coin_chart_summary" class="coin-chart-summary">-</div>
      </div>
      <div id="coin_chart_stats" class="coin-chart-stats"></div>
      <div class="coin-chart-wrap">
        <canvas id="coin_chart"></canvas>
        <div id="coin_chart_tooltip" class="coin-chart-tooltip"></div>
      </div>
      <div id="coin_record_list" class="coin-record-list"></div>
    </section>

    <section>
      <h2>最近日志</h2>
      <button id="detail_log_btn" class="active" onclick="setLogMode('detail')">详细日志</button>
      <button id="key_log_btn" onclick="setLogMode('key')">关键日志</button>
      <button onclick="clearLogs()">清除日志</button>
      <button id="auto_scroll_btn" class="active" onclick="toggleAutoScroll()">自动滚动：开</button>
      <div id="logs"></div>
    </section>

    <section>
      <h2>排除任务标签</h2>
      <div class="exclude-grid">
        <div class="coin-label">金币任务</div>
        <div id="coin_exclude_editor" class="tag-editor coin"></div>
        <button class="coin-outline" onclick="saveExcludeTags('coin')">保存金币</button>
        <div class="energy-label">体力任务</div>
        <div id="energy_exclude_editor" class="tag-editor energy"></div>
        <button class="energy-outline" onclick="saveExcludeTags('energy')">保存体力</button>
      </div>
    </section>

    <section>
      <h2>文字匹配规则</h2>
      <button onclick="saveRules()">保存规则</button>
      <button onclick="loadRules()">重新加载</button>
      <div id="rules" class="rules-list"></div>
    </section>
  </main>

  <script>
    const runningLabels = {
      running: '运行中',
      paused: '已暂停',
      stopped: '已停止'
    };

    const taskModeLabels = {
      taojinbi: '淘金币任务',
      energy: '做体力任务',
      unknown: '未知'
    };

    const pageTypeLabels = {
      unknown: '未知页面',
      unknown_taobao_page: '淘宝其他页面',
      external_app: '任务页 - 三方应用',
      taobao_home: '淘宝首页',
      coin_home: '淘金币首页',
      daily_task_list: '淘金币任务列表页',
      energy_task_list: '做任务赚体力列表页',
      taobao_browse_task: '任务页 - 滑动浏览',
      quiz: '任务页 - 答题',
      task_done: '任务完成页'
    };

    const actionLabels = {
      idle: '空闲',
      starting: '启动中',
      finding_entry: '寻找淘金币入口',
      switching_daily: '切换日常版',
      finding_task: '寻找任务',
      scrolling_task_list: '翻页寻找任务',
      clicking_task: '点击任务',
      doing_scroll_task: '模拟任务滚动',
      doing_jump_energy: '执行跳一跳拿体力',
      doing_quiz_task: '执行答题任务',
      doing_search_task: '执行搜索任务',
      returning_to_task_list: '回到任务列表页中',
      paused: '已暂停',
      stopping: '正在结束',
      error: '错误'
    };

    const ruleMeta = {
      action_text_pattern: ['动作按钮正则', 'pattern-list', '用于匹配“去完成/去逛逛”等按钮文本；保存时自动用 | 拼成正则。'],
      skip_task_extra_words: ['排除任务扩展词', 'list', '更长的跳过词库；任务名包含任一词就跳过。'],
      done_words: ['已完成任务词', 'list', '用于判断任务行/任务名是否已经完成；命中后不再点击该任务。'],
      search_browse_words: ['搜索浏览页词', 'list', '页面文本包含任一词时，认为是搜索浏览奖励页。'],
      coin_home_words: ['淘金币首页词', 'list', '页面包含这些词且没有任务区词时，判定为淘金币首页。'],
      coin_home_task_words: ['首页任务区词', 'list', '用于区分淘金币首页和任务列表/任务区。'],
      browse_page_words: ['浏览任务页词', 'list', '页面包含任一词时，判定为滑动浏览任务页。'],
      daily_fast_words: ['日常快速赚词', 'list', '识别今日速赚区域；命中时优先尝试展开更多任务。'],
      daily_task_area_words: ['日常任务区词', 'list', 'XML 页面包含这些词时，辅助判定为日常任务列表。'],
      task_list_words: ['任务列表页词', 'list', '页面包含任一词时，判定为淘金币任务列表页。'],
      task_list_bottom_words: ['任务列表底部词', 'list', '页面包含这些词时，认为任务列表已经到底；找不到任务时结束本轮，不再继续下翻。'],
      task_done_page_words: ['任务完成页词', 'list', '页面文本包含任一词时认为任务完成，但会先排除下面的排除项。'],
      task_done_exclude_words: ['完成词排除项', 'list', '如果同一文本包含这些词，即使含“已得”也不算完成，例如“累计已得”。'],
      quiz_words: ['答题页词', 'list', '页面包含任一词时，判定为趣味课堂答题页。'],
      shop_subscribe_words: ['店铺订阅阳性词', 'list', '页面包含这些词时，才判定仍在店铺订阅任务；“进店”不应放这里。'],
      shop_subscribe_action_pairs: ['店铺订阅动作配对', 'list', '一行一个“按钮正则=>日志名”；命中后点击，例如“进店.*=>进店”。'],
      daily_version_words: ['回日常版词', 'list', '匹配回日常版入口；命中后点击并等待赚更多金币。'],
      earn_more_words: ['赚更多金币词', 'list', '匹配进入任务列表的“赚更多金币”入口。'],
      earn_words: ['赚金币词', 'list', '兜底匹配“赚金币”入口。'],
      expand_words: ['展开词', 'list', '匹配更多任务展开入口；会优先点击可点击父节点。'],
      reward_button_pattern: ['奖励按钮正则', 'pattern-list', '匹配“领取奖励/立即领取/点击得”等奖励按钮；保存时自动用 | 拼成正则。'],
      ocr_done_text: ['OCR完成文字', 'text', '浏览任务中每 5 秒 OCR 查找该文字；命中后提前返回。'],
      ocr_done_extra_words: ['OCR辅助完成文字', 'list', '同样每 5 秒 OCR 查找；用于完成浮层里的辅助提示。']
    };

    async function post(url) {
      await fetch(url, { method: 'POST' });
      await refresh();
    }

    async function startTask(mode) {
      const userId = document.getElementById('android_user_select').value;
      const runAll = document.getElementById('run_all_users_toggle').checked;
      const path = mode === 'energy' ? '/api/start-energy' : '/api/start';
      const params = new URLSearchParams({
        android_user_id: userId,
        run_all_users: String(runAll)
      });
      await post(`${path}?${params}`);
    }

    async function saveAndroidUser() {
      const select = document.getElementById('android_user_select');
      const response = await fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ android_user_id: select.value })
      });
      if (!response.ok) {
        document.getElementById('last_error').textContent = '淘宝用户保存失败，请先重启GUI服务';
        return;
      }
      const result = await response.json();
      if (!result.ok) {
        document.getElementById('last_error').textContent = result.error || '淘宝用户保存失败';
        return;
      }
      await refresh();
    }

    async function saveRunAllUsers() {
      const toggle = document.getElementById('run_all_users_toggle');
      const response = await fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ run_all_users: toggle.checked })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        document.getElementById('last_error').textContent = result.error || '连续运行设置保存失败';
        return;
      }
      await refresh();
    }

    async function saveDailyFallback() {
      const toggle = document.getElementById('daily_fallback_toggle');
      const response = await fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ allow_daily_version_fallback: toggle.checked })
      });
      if (!response.ok) {
        document.getElementById('last_error').textContent = '回日常版兜底保存失败，请先重启GUI服务';
        return;
      }
      const result = await response.json();
      if (!result.ok) {
        document.getElementById('last_error').textContent = result.error || '回日常版兜底保存失败';
        return;
      }
      await refresh();
    }

    async function saveJumpEnergy() {
      const toggle = document.getElementById('jump_energy_toggle');
      const response = await fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enable_jump_energy: toggle.checked })
      });
      if (!response.ok) {
        document.getElementById('last_error').textContent = '跳一跳开关保存失败，请先重启GUI服务';
        return;
      }
      const result = await response.json();
      if (!result.ok) {
        document.getElementById('last_error').textContent = result.error || '跳一跳开关保存失败';
        return;
      }
      await refresh();
    }

    async function restartService() {
      document.getElementById('restart_service_btn').disabled = true;
      sessionStorage.setItem('skip_auto_start_once', '1');
      try {
        await fetch('/api/service/restart', { method: 'POST' });
      } catch (err) {
        document.getElementById('running').textContent = '服务未运行，请在淘宝任务启动器中启动';
        waitForServiceAndReload();
        return;
      }
      document.getElementById('running').textContent = '服务重启中';
      waitForServiceAndReload();
    }

    async function waitForServiceAndReload() {
      const deadline = Date.now() + 30000;
      while (Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        try {
          const response = await fetch(`/api/status?t=${Date.now()}`, { cache: 'no-store' });
          if (response.ok) {
            window.location.reload();
            return;
          }
        } catch (err) {
          // Service is expected to be briefly unavailable during restart.
        }
        if (Date.now() > deadline - 23000) {

        }

    function normalizeTags(value) {
      if (Array.isArray(value)) {
        return value.map(v => String(v).trim()).filter(Boolean);
      }
      return String(value ?? '').split(/\n|,|，/).map(v => v.trim()).filter(Boolean);
    }

    function tagEditorIsActive(editor) {
      return editor && editor.contains(document.activeElement);
    }

    function tagEditorIsDirty(editor) {
      return editor && editor.dataset.dirty === '1';
    }

    function markTagEditorDirty(editor) {
      if (editor) editor.dataset.dirty = '1';
    }

    function getTagEditorValues(editorOrId) {
      const editor = typeof editorOrId === 'string' ? document.getElementById(editorOrId) : editorOrId;
      if (!editor) return [];
      return Array.from(editor.querySelectorAll('.tag')).map(tag => tag.dataset.value).filter(Boolean);
    }

    function addTagToEditor(editor, value) {
      const clean = String(value ?? '').trim();
      if (!clean) return;
      const current = new Set(getTagEditorValues(editor));
      if (current.has(clean)) return;
      markTagEditorDirty(editor);
      renderTagEditor(editor, [...current, clean]);
    }

    function renderTagEditor(editor, values, options = {}) {
      const items = normalizeTags(values);
      const inputValue = options.keepInput ? (editor.querySelector('.tag-input')?.value || '') : '';
      const list = document.createElement('div');
      list.className = 'tag-list';
      items.forEach(value => {
        const tag = document.createElement('span');
        const remove = document.createElement('button');
        tag.className = 'tag';
        tag.dataset.value = value;
        tag.append(document.createTextNode(value));
        remove.className = 'tag-remove';
        remove.type = 'button';
        remove.textContent = 'X';
        remove.title = `删除 ${value}`;
        remove.addEventListener('click', () => {
          markTagEditorDirty(editor);
          renderTagEditor(editor, getTagEditorValues(editor).filter(item => item !== value), { keepInput: true });
        });
        tag.append(remove);
        list.append(tag);
      });

      const add = document.createElement('div');
      const input = document.createElement('input');
      const button = document.createElement('button');
      add.className = 'tag-add';
      input.className = 'tag-input';
      input.type = 'text';
      input.value = inputValue;
      input.placeholder = '新增一项';
      button.type = 'button';
      button.textContent = '添加';
      button.addEventListener('click', () => {
        addTagToEditor(editor, input.value);
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addTagToEditor(editor, input.value);
        }
      });
      add.append(input, button);
      editor.replaceChildren(list, add);
    }

    let lastCoinRecordKey = '';

    function parseRecordDate(dateText) {
      const parts = String(dateText || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(part => !Number.isFinite(part))) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function formatRecordDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function recentYearDates(recordDates = []) {
      const dates = [];
      const parsedDates = recordDates.map(parseRecordDate).filter(Boolean);
      const latestRecordDate = parsedDates.length ? new Date(Math.max(...parsedDates.map(date => date.getTime()))) : null;
      const now = new Date();
      const end = latestRecordDate && latestRecordDate > now ? latestRecordDate : now;
      const start = new Date(end);
      start.setDate(start.getDate() - 364);
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        dates.push(formatRecordDate(d));
      }
      return dates;
    }

    function daysBetween(a, b) {
      const ms = parseRecordDate(b).getTime() - parseRecordDate(a).getTime();
      return Math.max(0, Math.round(ms / 86400000));
    }

    function addDays(dateText, offset) {
      const date = parseRecordDate(dateText);
      date.setDate(date.getDate() + offset);
      return formatRecordDate(date);
    }

    function chooseTimeTicks(startDate, endDate, width) {
      const totalDays = Math.max(1, daysBetween(startDate, endDate));
      const maxTicks = Math.max(3, Math.min(8, Math.floor(width / 110)));
      const candidates = [1, 2, 3, 7, 14, 30, 60, 90, 180, 365];
      const step = candidates.find(value => Math.ceil(totalDays / value) <= maxTicks) || 365;
      const ticks = [startDate];
      for (let day = step; day < totalDays; day += step) {
        ticks.push(addDays(startDate, day));
      }
      if (ticks.length > 1 && totalDays - daysBetween(startDate, ticks[ticks.length - 1]) < step * 0.45) {
        ticks.pop();
      }
      if (ticks[ticks.length - 1] !== endDate) ticks.push(endDate);
      return ticks;
    }

    function formatAxisDate(dateText) {
      const [year, month, day] = String(dateText).split('-');
      return `${month}/${day}`;
    }

    function formatDelta(value) {
      if (!Number.isFinite(value)) return '-';
      if (value === 0) return '0';
      return `${value > 0 ? '+' : ''}${value}`;
    }

    function recordValue(record) {
      const finalValue = Number(record?.final);
      if (Number.isFinite(finalValue)) return finalValue;
      const lastValue = Number(record?.last);
      if (Number.isFinite(lastValue)) return lastValue;
      return Number(record?.max);
    }

    function setupCoinChartHover() {
      const canvas = document.getElementById('coin_chart');
      const tooltip = document.getElementById('coin_chart_tooltip');
      if (canvas.dataset.hoverReady === '1') return;
      canvas.dataset.hoverReady = '1';
      canvas.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
      canvas.addEventListener('mousemove', event => {
        if (!coinChartHoverPoints.length) return;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        let nearest = coinChartHoverPoints[0];
        for (const point of coinChartHoverPoints) {
          if (Math.abs(point.x - x) < Math.abs(nearest.x - x)) nearest = point;
        }
        tooltip.innerHTML = [
          `<strong>${nearest.date}</strong>`,
          `显示：${Number.isFinite(nearest.final) ? nearest.final : nearest.value}`,
          `最高：${nearest.max}`,
          `最低：${nearest.min}`,
          `初始：${nearest.first}`,
          `次数：${nearest.count || 1}`
        ].join('<br>');
        tooltip.style.display = 'block';
        const left = Math.min(rect.width - 170, Math.max(8, nearest.x + 12));
        const top = Math.max(8, nearest.y - 78);
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      });
    }

    function drawCoinChart(records, userId) {
      const canvas = document.getElementById('coin_chart');
      const summary = document.getElementById('coin_chart_summary');
      const list = document.getElementById('coin_record_list');
      const wrap = canvas.parentElement;
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(320, wrap.clientWidth);
      const height = Math.max(220, wrap.clientHeight);
      canvas.width = Math.floor(width * ratio);
      canvas.height = Math.floor(height * ratio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const userRecords = (((records || {}).users || {})[String(userId)] || {});
      const dates = recentYearDates(Object.keys(userRecords));
      const points = dates
        .map(date => ({ date, record: userRecords[date] }))
        .filter(point => point.record && Number.isFinite(Number(point.record.max)));
      setupCoinChartHover();
      coinChartHoverPoints = [];

      if (!points.length) {
        summary.textContent = `user ${userId} 暂无记录`;
        setCoinStats([]);
        list.replaceChildren();
        ctx.fillStyle = '#64748b';
        ctx.font = '14px Microsoft YaHei, sans-serif';
        ctx.fillText('暂无淘金币记录', 24, 42);
        return;
      }

      const values = points.flatMap(point => [Number(point.record.min), Number(point.record.max), recordValue(point.record)]).filter(Number.isFinite);
      let minValue = Math.min(...values);
      let maxValue = Math.max(...values);
      if (minValue === maxValue) {
        minValue -= 10;
        maxValue += 10;
      }
      const pad = Math.max(10, (maxValue - minValue) * 0.08);
      minValue = Math.max(0, minValue - pad);
      maxValue += pad;

      const first = points[0];
      const latest = points[points.length - 1];
      const dataStartDate = first.date;
      const dataEndDate = latest.date;
      const dataDays = daysBetween(dataStartDate, dataEndDate);
      let startDate = dataStartDate;
      let endDate = dataEndDate;
      if (dataDays === 0) {
        startDate = addDays(dataStartDate, -1);
        endDate = addDays(dataEndDate, 1);
      } else if (dataDays < 14) {
        const padDays = Math.max(1, Math.ceil(dataDays * 0.25));
        startDate = addDays(dataStartDate, -padDays);
        endDate = addDays(dataEndDate, padDays);
      }
      const totalDays = Math.max(1, daysBetween(startDate, endDate));
      const left = 62;
      const right = 24;
      const top = 24;
      const bottom = 48;
      const chartWidth = width - left - right;
      const chartHeight = height - top - bottom;
      const xForDate = date => left + daysBetween(startDate, date) * chartWidth / totalDays;
      const yForValue = value => top + (maxValue - value) * chartHeight / (maxValue - minValue);

      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#64748b';
      ctx.font = '12px Microsoft YaHei, sans-serif';
      ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i += 1) {
        const y = top + chartHeight * i / 4;
        const value = Math.round(maxValue - (maxValue - minValue) * i / 4);
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(width - right, y);
        ctx.stroke();
        ctx.fillText(String(value), left - 9, y + 4);
      }

      function drawLine(key, color, widthPx) {
        ctx.strokeStyle = color;
        ctx.lineWidth = widthPx;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        points.forEach((point, index) => {
          const x = xForDate(point.date);
          const y = yForValue(Number(point.record[key]));
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      function drawValueLine(color, widthPx) {
        ctx.strokeStyle = color;
        ctx.lineWidth = widthPx;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        points.forEach((point, index) => {
          const x = xForDate(point.date);
          const y = yForValue(recordValue(point.record));
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      ctx.strokeStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left, top + chartHeight);
      ctx.lineTo(width - right, top + chartHeight);
      ctx.stroke();

      ctx.textAlign = 'center';
      chooseTimeTicks(startDate, endDate, width).forEach(date => {
        const x = xForDate(date);
        ctx.strokeStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, top + chartHeight);
        ctx.stroke();
        ctx.fillStyle = '#64748b';
        ctx.fillText(formatAxisDate(date), x, height - 18);
      });

      drawLine('min', '#93c5fd', 1.5);
      drawValueLine('#d97706', 2.5);

      const showEveryPoint = points.length <= 45;
      points.forEach(point => {
        const max = Number(point.record.max);
        const min = Number(point.record.min);
        const value = recordValue(point.record);
        const x = xForDate(point.date);
        const y = yForValue(value);
        coinChartHoverPoints.push({
          x,
          y,
          date: point.date,
          value,
          max,
          min,
          first: Number(point.record.first ?? max),
          final: Number(point.record.final),
          count: point.record.count
        });
        if (showEveryPoint || point === latest) {
          ctx.fillStyle = point === latest ? '#d97706' : '#f59e0b';
          ctx.beginPath();
          ctx.arc(x, y, point === latest ? 4.5 : 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      const latestValue = recordValue(latest.record);
      const firstValue = recordValue(first.record);
      const delta = latestValue - firstValue;
      const allTimeLow = Math.min(...points.map(point => Number(point.record.min)));
      const allTimeHigh = Math.max(...points.map(point => Number(point.record.max)));
      const latestX = xForDate(latest.date);
      const latestY = yForValue(latestValue);
      ctx.textAlign = latestX > width - 140 ? 'right' : 'left';
      ctx.fillStyle = '#0f172a';
      ctx.font = '12px Microsoft YaHei, sans-serif';
      ctx.fillText(`${latest.date}  ${latestValue}`, latestX + (ctx.textAlign === 'right' ? -8 : 8), Math.max(16, latestY - 10));

      summary.textContent = `user ${userId}｜有记录 ${points.length} 天｜最新 ${latestValue}｜变化 ${formatDelta(delta)}`;
      setCoinStats([
        { label: Number.isFinite(Number(latest.record.final)) ? '结束读数' : '最新观测', value: String(latestValue) },
        { label: '一年变化', value: formatDelta(delta) },
        { label: '区间最低', value: String(allTimeLow) },
        { label: '区间最高', value: String(allTimeHigh) },
        { label: '记录天数', value: `${points.length} 天` }
      ]);

      list.replaceChildren(...points.slice(-8).reverse().map(point => {
        const div = document.createElement('div');
        const value = recordValue(point.record);
        const label = Number.isFinite(Number(point.record.final)) ? '终' : '新';
        div.textContent = `${point.date}  ${label} ${value}  初 ${point.record.first}  低 ${point.record.min}  高 ${point.record.max}`;
        return div;
      }));
    }

      }
      document.getElementById('activity').textContent = text(status.activity);
      document.getElementById('page_type').textContent = label(pageTypeLabels, status.page_type);
      document.getElementById('action').textContent = label(actionLabels, status.action);
      document.getElementById('current_task').textContent = text(status.current_task);
      const excludeTags = Array.isArray(status.exclude_tags) ? status.exclude_tags : [];
      const coinExcludeTags = Array.isArray(status.coin_exclude_tags) ? status.coin_exclude_tags : excludeTags;
      const energyExcludeTags = Array.isArray(status.energy_exclude_tags) ? status.energy_exclude_tags : [];
      document.getElementById('exclude_tags').textContent = [
        `金币: ${coinExcludeTags.length ? coinExcludeTags.join(', ') : '-'}`,
        `体力: ${energyExcludeTags.length ? energyExcludeTags.join(', ') : '-'}`
      ].join('；');
      renderExcludeEditor('coin', coinExcludeTags);
      renderExcludeEditor('energy', energyExcludeTags);
      document.getElementById('last_error').textContent = text(status.last_error);
      document.getElementById('updated_at').textContent = text(status.updated_at);

      const logBox = document.getElementById('logs');
      const logText = logs.logs.join('\n');
      if (isSelectingText() || logText === lastLogText) {
        return;
      }
      lastLogText = logText;
      logBox.replaceChildren(...logs.logs.map(line => {
        const div = document.createElement('div');
        div.className = isPageActionLogLine(line) ? 'log-line page-action' : 'log-line';
        renderLogLine(div, line);
        return div;
      }));
      const distanceToBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight;
      if (autoScrollLogs) {
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    function renderLogLine(container, line) {
      const source = String(line || '');
      const match = source.match(/(任务[:：]\s*|任务【)([^】；,，]+)(】?)/);
      if (!match) {
        container.textContent = source;
        return;
      }
      const before = source.slice(0, match.index) + match[1];
      const name = match[2];
      const after = source.slice(match.index + match[0].length);
      container.append(document.createTextNode(before));
      const span = document.createElement('span');
      span.className = 'log-task-name';
      span.textContent = name;
      container.append(span, document.createTextNode(after));
    }

    refresh();
    loadRules();
    setTimeout(autoStartOnLoad, 500);
    setInterval(refresh, 1000);
  </script>
</body>
</html>
